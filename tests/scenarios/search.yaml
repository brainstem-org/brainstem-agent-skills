# Search scenarios against the demo lab fixture (tests/fixtures/demo_lab.json).
# Ground truth comes from tests/harness/oracles.py.

- id: search-ephys-ca1
  tags: [skill-selection, relationships, regions]
  token: contributor-token
  turns:
    - Find the sessions with extracellular electrophysiology recordings in CA1. List them with their ids.
  expect:
    skill: brainstem-search
    requests:
      no_writes: true
      must_include:
        - {method: GET, path_contains: /taxonomies/anatomicalregion/}
        - {method: GET, path_contains: /modules/dataacquisition/}
    answer:
      oracle: ephys_sessions_in_ca1
      resource: session
      must_match_any: ["(?i)atlas|AIA|Allen"]

