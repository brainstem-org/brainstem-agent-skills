- id: search-public-only
  tags: [access-control]
  token: contributor-token
  turns:
    - Using only BrainSTEM's public portal (no login), find sessions with extracellular electrophysiology recordings in CA1.
  expect:
    skill: brainstem-search
    # "No login" may mean no token at all (reference unreadable, answer says it was not checked) or the
    # token for the reference only. Either way every data request must go to the public portal.
    reads_reference: false
    requests:
      no_writes: true
      only_portal: public
    answer:
      oracle: none
      resource: session
      must_match_any: ["(?i)public portal"]
