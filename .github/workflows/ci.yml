name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      # The agent reference and schemas belong to BrainSTEM and are not committed: fetch them from a server
      # (repository variable BRAINSTEM_FIXTURE_URL, default www.brainstem.org), cached for a week.
      - name: Fixture source and cache week
        id: fixtures
        run: |
          echo "url=${{ vars.BRAINSTEM_FIXTURE_URL || 'https://www.brainstem.org' }}" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the fetched reference and schemas
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            tests/fixtures/agent_reference.json
            tests/fixtures/schemas.json.gz
          key: brainstem-fixtures-${{ steps.fixtures.outputs.url }}-${{ steps.fixtures.outputs.week }}-${{ hashFiles('tools/fetch_fixtures.py') }}
      - name: Fetch the server's agent reference and schemas
        if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/fetch_fixtures.py "${{ steps.fixtures.outputs.url }}"
      - name: Vendored skill files are current
        run: python tools/vendor_references.py --check
      - name: Validate skills against the Agent Skills spec
        run: |
          shopt -s nullglob
          for skill in skills/*/; do skills-ref validate "$skill"; done
      - name: Static tests, mock API and grader
        run: python -m pytest tests/static tests/mock_api tests/harness/test_grade.py -q
